name: Fetch Feeds
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Feeds
        run: node scripts/fetch_feeds.cjs
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/feeds/
          if git diff --staged --quiet; then
            echo "No changes in feeds."
          else
            git commit -m "Automated feed update"
            git push origin main
          fi
